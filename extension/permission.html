<!doctype html>
<html><head><meta charset="utf-8"><title>Microphone permission — Meeting AI</title>
<link rel="stylesheet" href="popup.css"><style>body{width:auto;max-width:520px;margin:40px auto}</style></head>
<body>
  <header><span class="dot"></span> Meeting AI — microphone</header>
  <section>
    <p>To include <b>your own voice</b> in Google Meet notes, the extension needs microphone permission. Google Meet does not play your voice back into the tab, so tab capture alone only records the other participants.</p>
    <p class="small muted">The microphone is used only while a recording you started is active.</p>
    <button class="primary" id="grant" style="width:auto">Allow microphone</button>
    <p id="msg" class="small"></p>
  </section>
  <script src="permission.js"></script>
</body></html>
